openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BIR Tax Client Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: clients
    description: Tax clients
  - name: engagements
    description: Tax engagements
  - name: deadlines
    description: Deadline management
  - name: checklists
    description: Checklist items
  - name: documents
    description: Document management
  - name: comments
    description: Comments and approvals
  - name: notifications
    description: Notifications
  - name: audit
    description: Audit trail
  - name: dashboard
    description: Dashboard summaries
  - name: connector
    description: >-
      Claude / MCP connector: the consent page (/connect/authorize) and connected apps. The MCP endpoint
      (/api/mcp) and the OAuth protocol endpoints (/api/oauth/authorize|token|register|revoke, /.well-known/*)
      are not described here.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Public auth settings (no authentication)
      description: Whether the login page may show the demo accounts (true when SEED_DEMO_ACCOUNTS=true, or outside production unless SEED_DEMO_ACCOUNTS=false).
      security: []
      responses:
        "200":
          description: Auth settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid field (e.g. a password shorter than 8 characters)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The change would demote the last super_admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: A super_admin cannot delete their own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The user is the last super_admin (two super admins deleting each other at once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # CLIENTS
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List tax clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientBody"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid body (e.g. a malformed TIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientBody"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          description: Invalid body (e.g. a malformed TIN)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clients/{id}/generate-deadlines:
    post:
      operationId: generateClientDeadlines
      tags: [clients]
      summary: Generate annual BIR deadlines for a client
      description: Auto-generates all required BIR deadline entries for a given tax year based on the client's registered tax types in their BIR 2303.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDeadlinesBody"
      responses:
        "200":
          description: Deadlines generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateDeadlinesResult"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /clients/{id}/compliance:
    get:
      operationId: getClientCompliance
      tags: [clients]
      summary: Get client compliance checklist for a tax year
      description: Returns all required BIR tax form filings for the client for a given year with filing status.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Compliance checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientCompliance"
        "404":
          description: Client not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ENGAGEMENTS
  /engagements:
    get:
      operationId: listEngagements
      tags: [engagements]
      summary: List engagements
      parameters:
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of engagements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Engagement"
    post:
      operationId: createEngagement
      tags: [engagements]
      summary: Create engagement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEngagementBody"
      responses:
        "201":
          description: Created engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"

  /engagements/{id}:
    get:
      operationId: getEngagement
      tags: [engagements]
      summary: Get engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEngagement
      tags: [engagements]
      summary: Update engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEngagementBody"
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"
    delete:
      operationId: deleteEngagement
      tags: [engagements]
      summary: Delete engagement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /engagements/{id}/approve:
    post:
      operationId: approveEngagement
      tags: [engagements]
      summary: Approve engagement (Manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveEngagementBody"
      responses:
        "200":
          description: Updated engagement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Engagement"

  # DEADLINES
  /deadlines:
    get:
      operationId: listDeadlines
      tags: [deadlines]
      summary: List deadlines
      parameters:
        - name: engagementId
          in: query
          schema:
            type: ["integer", "null"]
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deadline"
    post:
      operationId: createDeadline
      tags: [deadlines]
      summary: Create deadline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeadlineBody"
      responses:
        "201":
          description: Created deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"

  /deadlines/{id}:
    get:
      operationId: getDeadline
      tags: [deadlines]
      summary: Get deadline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDeadline
      tags: [deadlines]
      summary: Update deadline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeadlineBody"
      responses:
        "200":
          description: Updated deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deadline"
    delete:
      operationId: deleteDeadline
      tags: [deadlines]
      summary: Delete deadline
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CHECKLISTS
  /checklist-items:
    get:
      operationId: listChecklistItems
      tags: [checklists]
      summary: List checklist items
      parameters:
        - name: engagementId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of checklist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistItem"
    post:
      operationId: createChecklistItem
      tags: [checklists]
      summary: Create checklist item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChecklistItemBody"
      responses:
        "201":
          description: Created checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /checklist-items/{id}:
    patch:
      operationId: updateChecklistItem
      tags: [checklists]
      summary: Update checklist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChecklistItemBody"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"
    delete:
      operationId: deleteChecklistItem
      tags: [checklists]
      summary: Delete checklist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # DOCUMENTS
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      description: |
        Client accounts are always restricted to their own client, whatever filters they pass.
        Without limit/offset every match is returned. The body stays a plain array; the
        X-Total-Count header carries the number of matches before paging.
      parameters:
        - name: engagementId
          in: query
          schema:
            type: ["integer", "null"]
        - name: clientId
          in: query
          schema:
            type: ["integer", "null"]
        - name: q
          in: query
          description: Original file name contains (case-insensitive, literal; at most 200 characters).
          schema:
            type: string
            maxLength: 200
        - name: stage
          in: query
          description: Filing workflow stage of the document, or "none" for documents not linked to a stage.
          schema:
            type: string
            enum: [source_collection, draft_return, confirmation, payment, none]
        - name: mimeType
          in: query
          description: MIME type prefix ("image/", "application/pdf"); comma-separated = any of (at most 10).
          schema:
            type: string
        - name: order
          in: query
          description: By upload time; "asc" (default, oldest first) or "desc" (newest first).
          schema:
            type: string
            enum: [asc, desc]
        - name: limit
          in: query
          description: Page size (1-200). Omit for every match.
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: List of documents
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "400":
          description: Invalid filter or paging value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Upload document (metadata)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentBody"
      responses:
        "201":
          description: Created document record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentBody"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # COMMENTS
  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments
      parameters:
        - name: engagementId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Create comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    patch:
      operationId: updateComment
      tags: [comments]
      summary: Update comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentBody"
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [notifications]
      summary: Unread notification count of the current user
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # AUDIT TRAIL
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs
      description: Managers and super admins only. Newest first. The body stays a plain array; the X-Total-Count header carries the number of matching entries.
      parameters:
        - name: engagementId
          in: query
          description: Entries about this engagement (entityType engagement).
          schema:
            type: ["integer", "null"]
        - name: clientId
          in: query
          description: Entries about this client (entityType client).
          schema:
            type: ["integer", "null"]
        - name: userId
          in: query
          description: Entries made by this user.
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          description: Exact action (see GET /audit-logs/filters).
          schema:
            type: string
            maxLength: 64
        - name: entityType
          in: query
          description: Exact entity type (see GET /audit-logs/filters).
          schema:
            type: string
            maxLength: 64
        - name: from
          in: query
          description: First day, inclusive (YYYY-MM-DD, Asia/Manila).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day, inclusive (YYYY-MM-DD, Asia/Manila).
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Description contains (case-insensitive, literal; at most 200 characters).
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          description: Page size (default 50, at most 500; malformed values fall back to the default).
          schema:
            type: ["integer", "null"]
        - name: offset
          in: query
          description: Entries to skip (default 0; malformed values fall back to 0).
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of audit logs
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "400":
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /audit-logs/filters:
    get:
      operationId: getAuditLogFilters
      tags: [audit]
      summary: Filter options of the audit log
      description: Managers and super admins only. The users, actions and entity types that occur in the log.
      responses:
        "200":
          description: Filter options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogFilters"

  /audit-logs/export.csv:
    get:
      operationId: exportAuditLogsCsv
      tags: [audit]
      summary: Export audit logs as CSV
      description: |
        Managers and super admins only. Same filters as GET /audit-logs, newest first, at most
        10,000 rows (RFC 4180, UTF-8 with BOM, CRLF). The export itself is audited.
      parameters:
        - name: engagementId
          in: query
          description: Entries about this engagement (entityType engagement).
          schema:
            type: ["integer", "null"]
        - name: clientId
          in: query
          description: Entries about this client (entityType client).
          schema:
            type: ["integer", "null"]
        - name: userId
          in: query
          description: Entries made by this user.
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          description: Exact action (see GET /audit-logs/filters).
          schema:
            type: string
            maxLength: 64
        - name: entityType
          in: query
          description: Exact entity type (see GET /audit-logs/filters).
          schema:
            type: string
            maxLength: 64
        - name: from
          in: query
          description: First day, inclusive (YYYY-MM-DD, Asia/Manila).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day, inclusive (YYYY-MM-DD, Asia/Manila).
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Description contains (case-insensitive, literal; at most 200 characters).
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: CSV file (attachment)
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            X-Export-Truncated:
              description: '"true" when more entries matched than the 10,000 exported.'
              schema:
                type: string
                enum: ["true", "false"]
            Content-Disposition:
              description: attachment; filename="audit-log-YYYY-MM-DD.csv"
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/my-work:
    get:
      operationId: getMyWork
      tags: [dashboard]
      summary: The current user's "needs my action" list
      description: |
        Role-aware. review (managers / super admins): filings with stages awaiting review,
        oldest first. maker: open filings assigned to me by due date, plus their open
        deadlines due in the next windowDays days. client: the linked client's open deadlines
        and filings in progress. Each list holds at most 25 rows; totals has the full counts.
      responses:
        "200":
          description: My work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyWork"

  /dashboard/upcoming-deadlines:
    get:
      operationId: getUpcomingDeadlines
      tags: [dashboard]
      summary: Get upcoming deadlines (next 30 days)
      responses:
        "200":
          description: Upcoming deadlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeadlineWithContext"

  /dashboard/overdue:
    get:
      operationId: getOverdueItems
      tags: [dashboard]
      summary: Get overdue deadlines and engagements
      responses:
        "200":
          description: Overdue items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverdueSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent audit activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  /dashboard/engagement-status:
    get:
      operationId: getEngagementStatusBreakdown
      tags: [dashboard]
      summary: Get engagement count breakdown by status
      responses:
        "200":
          description: Status breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusCount"

  # CONNECTOR (Claude / MCP)
  /oauth/connector:
    get:
      operationId: getConnectorInfo
      tags: [connector]
      summary: MCP connector settings for the signed-in user
      description: >-
        Whether the connector is enabled, the URL to paste into claude.ai (Customize > Connectors > Add custom connector)
        and the scopes with whether this user's role can use them. mcpUrl is null when disabled or when the server cannot
        build a public HTTPS URL (problem says why).
      responses:
        "200":
          description: Connector settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorInfo"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /oauth/requests/{id}:
    get:
      operationId: getOAuthRequest
      tags: [connector]
      summary: A pending connector sign-in request (for the consent page)
      description: >-
        The request id comes from the consent page URL (/connect/authorize?request=<id>). 404 when unknown, expired
        (10 minutes) or already decided. 401 when not signed in: sign in, then come back to the same URL.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRequest"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown, expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /oauth/requests/{id}/decision:
    post:
      operationId: decideOAuthRequest
      tags: [connector]
      summary: Approve or deny a pending connector sign-in request
      description: >-
        Single use. Must be sent from the web app (Origin checked) as application/json. On success navigate the
        browser to redirectTo (window.location.assign): the client's redirect URI with ?code=… or ?error=access_denied.
        Scopes the user's role cannot use are dropped; scopes lists what was granted (empty when denied).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthDecisionBody"
      responses:
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthDecisionResult"
        "400":
          description: Invalid body, a scope that was not requested, or taxaide.read missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not sent from the TaxAide web app (Origin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown, expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Body is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /oauth/grants:
    get:
      operationId: listOAuthGrants
      tags: [connector]
      summary: Active connector connections
      description: The caller's own active connections, newest first. all=1 (super_admin only, else 403) lists everyone's.
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Active grants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OAuthGrant"
        "403":
          description: all=1 without super_admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /oauth/grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      tags: [connector]
      summary: Disconnect a connector
      description: >-
        Revokes every token of the connection at once. Own grants, or anyone's for super_admin; any other id answers 404.
        Must be sent from the web app (Origin checked).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked
        "403":
          description: Not sent from the TaxAide web app (Origin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown, already revoked, or someone else's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  headers:
    XTotalCount:
      description: Number of matching rows before paging.
      schema:
        type: integer

  schemas:
    AuthConfig:
      type: object
      properties:
        demoAccounts:
          type: boolean
          description: Whether the demo accounts are seeded (the login page may show them).
      required:
        - demoAccounts

    UnreadCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginBody:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required:
        - user
        - message

    UserRole:
      type: string
      enum: [super_admin, manager, maker, accountant, client, viewer]
      description: maker and accountant are equivalent; viewer is a legacy alias of client.

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        clientId:
          type: ["integer", "null"]
          description: Linked client for client/viewer accounts (null for staff).
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - email
        - name
        - role
        - createdAt
        - updatedAt

    CreateUserBody:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        password:
          type: string
        clientId:
          type: ["integer", "null"]
          description: Linked client for client/viewer accounts.
      required:
        - email
        - name
        - role
        - password

    UpdateUserBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
          enum: [super_admin, manager, maker, accountant, client, viewer, null]
        password:
          type: ["string", "null"]
        currentPassword:
          type: ["string", "null"]
          description: Required (and checked) when users change their own password; a super_admin resetting another account's password does not send it.
        clientId:
          type: ["integer", "null"]
          description: Linked client for client/viewer accounts (super_admin only).

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        tin:
          type: string
          description: "###-###-###-### or ###-###-###-##### (9-digit TIN + branch code); other values are rejected with 400"
        businessType:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        fiscalYearEnd:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        tradeName:
          type: ["string", "null"]
        rdoCode:
          type: ["string", "null"]
        registrationDate:
          type: ["string", "null"]
        lineOfBusiness:
          type: ["string", "null"]
        incomeTaxType:
          type: ["string", "null"]
          description: "'individual' (Form 1701) or 'corporate' (Form 1702)"
        vatRegistered:
          type: boolean
          description: "Registered for VAT — requires 2550M (monthly) and 2550Q (quarterly)"
        percentageTaxRegistered:
          type: boolean
          description: "Non-VAT — requires 2551Q (quarterly)"
        withholdsCompensation:
          type: boolean
          description: "Withholds taxes on compensation — requires 1601C (monthly) and 1604CF (annual)"
        withholdsEwt:
          type: boolean
          description: "Withholds creditable income tax (EWT) — requires 1601EQ (quarterly) and 1604E (annual)"
        subjectToDst:
          type: boolean
          description: "Subject to Documentary Stamp Tax — requires 2000 (monthly)"
        withholdsFinal:
          type: boolean
          description: "Withholds final taxes — requires 0619F (monthly) and 1604F (annual)"
        hasInventory:
          type: boolean
          description: "Maintains inventory — requires Annual Inventory List (Jan 30)"
        isLessor:
          type: boolean
          description: "Is a lessor — requires Lessee Information Statement (Jan 31)"
        isEsalesRequired:
          type: boolean
          description: "Required to submit eSales Report (monthly)"
        createdAt:
          type: string
        updatedAt:
          type: string
        workflowCounts:
          type: object
          description: "Filing workflow badge counts (GET /clients only): the same items the client page lists for the current tax year, plus every overdue open deadline."
          properties:
            inProgress:
              type: integer
              description: "This tax year's filings whose linked engagement is in progress"
            forReview:
              type: integer
              description: "This tax year's filings with at least one stage awaiting manager review"
            overdue:
              type: integer
              description: "Open deadlines past due (any tax year), one per filing"
          required:
            - inProgress
            - forReview
            - overdue
      required:
        - id
        - name
        - tin
        - businessType
        - status
        - vatRegistered
        - percentageTaxRegistered
        - withholdsCompensation
        - withholdsEwt
        - subjectToDst
        - createdAt
        - updatedAt

    CreateClientBody:
      type: object
      properties:
        name:
          type: string
        tin:
          type: string
          description: "###-###-###-### or ###-###-###-##### (9-digit TIN + branch code); other values are rejected with 400"
        businessType:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        fiscalYearEnd:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        tradeName:
          type: ["string", "null"]
        rdoCode:
          type: ["string", "null"]
        registrationDate:
          type: ["string", "null"]
        lineOfBusiness:
          type: ["string", "null"]
        incomeTaxType:
          type: ["string", "null"]
        vatRegistered:
          type: boolean
        percentageTaxRegistered:
          type: boolean
        withholdsCompensation:
          type: boolean
        withholdsEwt:
          type: boolean
        subjectToDst:
          type: boolean
        withholdsFinal:
          type: boolean
        hasInventory:
          type: boolean
        isLessor:
          type: boolean
        isEsalesRequired:
          type: boolean
      required:
        - name
        - tin
        - businessType

    UpdateClientBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        tin:
          type: ["string", "null"]
          description: "###-###-###-### or ###-###-###-##### (9-digit TIN + branch code); other values are rejected with 400"
        businessType:
          type: ["string", "null"]
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        fiscalYearEnd:
          type: ["string", "null"]
        fiscalYearStart:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
          enum: [active, inactive, "null"]
        tradeName:
          type: ["string", "null"]
        rdoCode:
          type: ["string", "null"]
        registrationDate:
          type: ["string", "null"]
        lineOfBusiness:
          type: ["string", "null"]
        incomeTaxType:
          type: ["string", "null"]
        vatRegistered:
          type: ["boolean", "null"]
        percentageTaxRegistered:
          type: ["boolean", "null"]
        withholdsCompensation:
          type: ["boolean", "null"]
        withholdsEwt:
          type: ["boolean", "null"]
        subjectToDst:
          type: ["boolean", "null"]
        withholdsFinal:
          type: ["boolean", "null"]
        hasInventory:
          type: ["boolean", "null"]
        isLessor:
          type: ["boolean", "null"]
        isEsalesRequired:
          type: ["boolean", "null"]

    GenerateDeadlinesBody:
      type: object
      properties:
        year:
          type: integer
          description: "The tax year to generate deadlines for (e.g. 2025)"
        overwrite:
          type: boolean
          description: "If true, delete existing auto-generated deadlines for this year before generating new ones"
      required:
        - year

    GenerateDeadlinesResult:
      type: object
      properties:
        created:
          type: integer
        message:
          type: string
      required:
        - created
        - message

    ComplianceItem:
      type: object
      properties:
        formNumber:
          type: string
          description: "BIR form number (e.g. 2550Q, 1702)"
        description:
          type: string
        period:
          type: string
          description: "Human-readable period (e.g. 'January 2025', 'Q1 2025')"
        dueDate:
          type: string
          description: "ISO date string of the filing deadline"
        frequency:
          type: string
          enum: [monthly, quarterly, annual]
        status:
          type: string
          enum: [pending, filed, overdue]
        deadlineId:
          type: ["integer", "null"]
          description: "ID of the linked deadline record, if it exists"
        engagementId:
          type: ["integer", "null"]
          description: "Filing (engagement) linked to the deadline, if any"
        workflowStage:
          type: ["string", "null"]
        workflowStatus:
          type: ["string", "null"]
          description: "Status of the linked engagement (pending | in_progress | completed)"
        stageStatuses:
          description: "Per-stage statuses of the linked engagement (null without one); payment is not_applicable when taxPayable is 0"
          oneOf:
            - $ref: "#/components/schemas/StageStatuses"
            - type: "null"
        taxPayable:
          type: ["number", "null"]
          description: "Tax amount payable (null = not entered, 0 = none due, >0 = payment required)"
      required:
        - formNumber
        - description
        - period
        - dueDate
        - frequency
        - status
        - deadlineId
        - engagementId
        - workflowStage
        - workflowStatus
        - stageStatuses
        - taxPayable

    ClientCompliance:
      type: object
      properties:
        clientId:
          type: integer
        clientName:
          type: string
        year:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceItem"
        summary:
          type: object
          properties:
            total:
              type: integer
            filed:
              type: integer
            pending:
              type: integer
            overdue:
              type: integer
          required: [total, filed, pending, overdue]
      required:
        - clientId
        - clientName
        - year
        - items
        - summary

    Engagement:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        clientName:
          type: ["string", "null"]
        title:
          type: string
        taxType:
          type: string
        formNumber:
          type: string
          description: "Short form code for headings (\"1601C\", \"1702\", \"AnnexF\"), derived on the server like the compliance checklist's. Sent by the /engagements endpoints."
        period:
          type: string
        fiscalYear:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/EngagementStatus"
        assignedTo:
          type: ["integer", "null"]
        assignedToName:
          type: ["string", "null"]
        approvedBy:
          type: ["integer", "null"]
        approvedByName:
          type: ["string", "null"]
        approvedAt:
          type: ["string", "null"]
        approvalNotes:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        taxPayable:
          type: ["number", "null"]
          description: "Tax payable amount (null = not entered; 0 = none; >0 = payment required)"
        workflowStage:
          type: ["string", "null"]
          description: "Legacy single-stage pointer (the stages are now independent)"
        stageStatuses:
          $ref: "#/components/schemas/StageStatuses"
        stagesForReview:
          type: integer
          description: "Number of stages awaiting manager review"
        isAmendment:
          type: boolean
        amendedEngagementId:
          type: ["integer", "null"]
          description: "For an amendment: the filing it amends"
        createdAt:
          type: string
        updatedAt:
          type: string
      description: "stageStatuses, stagesForReview, workflowStage, isAmendment and amendedEngagementId are sent by the /engagements endpoints (not by GET /dashboard/overdue)."
      required:
        - id
        - clientId
        - title
        - taxType
        - period
        - status
        - createdAt
        - updatedAt

    EngagementStatus:
      type: string
      enum: [pending, in_progress, completed]
      description: "pending (no stage started), in_progress, completed (every required stage approved). Rows from before the stage workflow may still hold the retired for_review / approved / filed; show those as-is."

    StageStatus:
      type: string
      enum: [not_started, in_progress, for_review, approved, not_applicable]

    StageStatuses:
      type: object
      description: "Status of each of the four parallel filing stages (payment is not_applicable when taxPayable is 0)"
      properties:
        source_collection:
          $ref: "#/components/schemas/StageStatus"
        draft_return:
          $ref: "#/components/schemas/StageStatus"
        confirmation:
          $ref: "#/components/schemas/StageStatus"
        payment:
          $ref: "#/components/schemas/StageStatus"
      required:
        - source_collection
        - draft_return
        - confirmation
        - payment

    CreateEngagementBody:
      type: object
      properties:
        clientId:
          type: integer
        title:
          type: string
        taxType:
          type: string
        period:
          type: string
        fiscalYear:
          type: ["string", "null"]
        assignedTo:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - clientId
        - title
        - taxType
        - period

    UpdateEngagementBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
        taxType:
          type: ["string", "null"]
        period:
          type: ["string", "null"]
        fiscalYear:
          type: ["string", "null"]
        taxPayable:
          type: ["number", "null"]
          minimum: 0
          description: "Tax payable amount (null = not entered; 0 = none; >0 = payment required)"
        status:
          type: ["string", "null"]
          enum: [pending, in_progress, for_review, approved, filed, completed, "null"]
          description: "Manager-only override to pending or in_progress. completed is reached by approving the stages (400); the retired for_review / approved / filed are rejected (400)."
        assignedTo:
          type: ["integer", "null"]
        dueDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    ApproveEngagementBody:
      type: object
      properties:
        approved:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - approved

    Deadline:
      type: object
      properties:
        id:
          type: integer
        engagementId:
          type: ["integer", "null"]
        clientId:
          type: ["integer", "null"]
        clientName:
          type: ["string", "null"]
        title:
          type: string
        formNumber:
          type: string
          description: "Form code from the title, the same as the compliance checklist's (\"1601EQ\", \"AnnexF\"); \"OTHER\" for a title that names no form. Sent by the /deadlines endpoints."
        period:
          type: string
          description: "Period label from the title, the same as the compliance checklist's (\"Q1 2026\", \"Annual 2026\"); the whole title when it has none. Sent by the /deadlines endpoints."
        description:
          type: ["string", "null"]
        dueDate:
          type: string
          description: "YYYY-MM-DD"
        status:
          type: string
          enum: [pending, completed, overdue]
          description: "Stored as pending / completed (completed when the linked filing is completed); overdue is only sent by GET /dashboard/overdue. Derive overdue from dueDate (Asia/Manila) elsewhere."
        priority:
          type: string
          enum: [low, medium, high]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - engagementId
        - clientId
        - clientName
        - title
        - description
        - dueDate
        - status
        - priority
        - createdAt
        - updatedAt

