        title:
          type: string
          description: Short label for the consent screen, e.g. "View your TaxAide data".
        description:
          type: string
        available:
          type: boolean
          description: Whether the signed-in user's role can use this scope (client accounts cannot use taxaide.write).
      required: [name, title, description, available]

    ConnectorInfo:
      type: object
      properties:
        enabled:
          type: boolean
        mcpUrl:
          type: ["string", "null"]
          description: The connector URL to paste into claude.ai, e.g. https://taxaide.example.com/api/mcp.
        issuer:
          type: ["string", "null"]
          description: The public origin (OAuth issuer).
        problem:
          type: ["string", "null"]
          description: Why mcpUrl is null although enabled (e.g. not served over HTTPS in production).
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorScope"
      required: [enabled, mcpUrl, issuer, problem, scopes]

    OAuthClientSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
          description: Chosen by whoever registered the client; untrusted. Show redirectHost prominently.
        uri:
          type: ["string", "null"]
        logoUri:
          type: ["string", "null"]
      required: [id, name, uri, logoUri]

    OAuthRequestUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
      required: [id, name, email, role]

    OAuthRequest:
      type: object
      properties:
        id:
          type: string
        expiresAt:
          type: string
        client:
          $ref: "#/components/schemas/OAuthClientSummary"
        redirectUri:
          type: string
        redirectHost:
          type: string
          description: Host the browser returns to after the decision (e.g. claude.ai).
        scopes:
          type: array
          description: The requested scopes (taxaide.read is always included).
          items:
            $ref: "#/components/schemas/ConnectorScope"
        user:
          $ref: "#/components/schemas/OAuthRequestUser"
      required: [id, expiresAt, client, redirectUri, redirectHost, scopes, user]

    OAuthDecisionBody:
      type: object
      properties:
        approve:
          type: boolean
        scopes:
          type: array
          description: Scopes to grant when approving (a subset of the requested ones, must include taxaide.read). Default all requested.
          items:
            type: string
      required: [approve]

    OAuthDecisionResult:
      type: object
      properties:
        redirectTo:
          type: string
        scopes:
          type: array
          items:
            type: string
      required: [redirectTo, scopes]

    OAuthGrant:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: string
        clientName:
          type: ["string", "null"]
        redirectHost:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
        lastUsedAt:
          type: ["string", "null"]
        expiresAt:
          type: string
          description: When the connection lapses unless the client refreshes it (30 days after the last refresh).
        user:
          $ref: "#/components/schemas/OAuthRequestUser"
      required: [id, clientId, clientName, redirectHost, scopes, createdAt, lastUsedAt, expiresAt, user]
