kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
# "/.well-known" carries the OAuth discovery documents of the MCP connector, and
# "/authorize", "/token", "/register" are origin-root aliases of /api/oauth/* for a
# claude.ai fallback. Without them the web app's "/*" -> index.html rewrite would answer
# these paths with HTML. See replit.md, "Connecting Claude (claude.ai custom connector)".
paths = ["/api", "/.well-known", "/authorize", "/token", "/register"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
